apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-registration-service
  namespace: traffic-control
spec:
  replicas: 1
  selector:
    matchLabels: { app: vehicle-registration-service }
  template:
    metadata:
      labels: { app: vehicle-registration-service }
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "vehicle-registration-service"
        dapr.io/app-port: "6002"
    spec:
      containers:
        - name: vehicle-registration-service
          image: vehicle-registration-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6002
          readinessProbe:
            httpGet: { path: /healthz, port: 6002 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-registration-service
  namespace: traffic-control
spec:
  selector: { app: vehicle-registration-service }
  ports:
    - port: 6002
---
